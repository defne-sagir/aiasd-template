<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- serves: REQ-001, REQ-006 -->
<main class="phone">
  <h1>[Your app name]</h1>
  <p>Log in with your e-mail address. We send you a 4-digit code; there is no password.</p>
  <form action="code.html">
    <label for="email">E-mail address</label>
    <input id="email" type="email" required placeholder="deniz@example.com">
    <button class="button" type="submit">Send code</button>
  </form>
</main>
</body>
</html>
